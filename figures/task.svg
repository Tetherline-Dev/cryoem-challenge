<text x="548" y="311" font-size="10.5" fill="currentColor" text-anchor="start">75% of the kept particles</text>
<text x="16" y="342" font-size="10.5" fill="var(--muted)" text-anchor="start">curved arrows: each photo's report arrives 75 s after it is taken, while you keep deciding.</text>
<text x="548" y="331" font-size="11" fill="var(--accent-ink)" text-anchor="start" font-weight="600">score = hours taken</text>
