<text x="630" y="66" font-size="10.5" fill="currentColor" text-anchor="start">shooting a hole takes</text>
<text x="630" y="80" font-size="10.5" fill="currentColor" text-anchor="start">all its photos (3 to 7),</text>
<text x="630" y="94" font-size="10.5" fill="currentColor" text-anchor="start">a few seconds each</text>
<text x="630" y="116" font-size="10.5" fill="var(--muted)" text-anchor="start">each photo is checked</text>
<text x="630" y="130" font-size="10.5" fill="var(--muted)" text-anchor="start">by software; its report</text>
<text x="630" y="144" font-size="10.5" fill="var(--muted)" text-anchor="start">reaches you 75 s later</text>
<text x="506" y="186" font-size="10.5" fill="var(--muted)" text-anchor="start">Weeks later an expert keeps the good</text>
<text x="506" y="200" font-size="10.5" fill="var(--muted)" text-anchor="start">particles of every photo. That count is</text>
<text x="506" y="214" font-size="10.5" fill="var(--muted)" text-anchor="start">the score; you never see it on the day.</text>
<text x="16" y="276" font-size="9.5" fill="var(--muted)" text-anchor="start" font-family="'IBM Plex Mono', Menlo, monospace" letter-spacing="0.06em">WHERE THE HOURS GO</text>
